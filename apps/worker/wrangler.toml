name = "japari-worker"
# 入口为 SWC 构建产物
main = "dist/worker.js"
compatibility_date = "2024-01-01"

# 本地调试: cd apps/worker && npm run dev
# 使用 .dev.vars 配置敏感项（不提交），参考 .dev.vars.example

[vars]
# 非敏感、可提交的默认值（可选）
# QQ_SERVER、ADMINS、NODE_URL、BOT_QQ_ID、OSU_APP_KEY 等建议放 .dev.vars

[[d1_databases]]
binding = "DB"
database_name = "japari-d1"
database_id = "<from dashboard>"
# 本地 wrangler dev 使用本地 SQLite，不连远程可留空或注释 database_id 用本地

[[kv_namespaces]]
binding = "KV"
id = "<from dashboard>"
# 本地 wrangler dev 使用本地 KV 存储

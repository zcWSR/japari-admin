name = "japari-worker"
# 融合后由 OpenNext 构建，入口为 .open-next/worker.js
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# 使用方式：复制为 wrangler.toml 并填入下方占位符（wrangler.toml 已加入 .gitignore，不会提交）
# 本地调试: 在 apps/worker 下执行 npm run dev（next dev）或 npm run preview（OpenNext 本地 Worker）
# .dev.vars 与本文件同目录，格式 KEY=value 每行一个

[vars]
# 非敏感默认值（可选）；敏感项放 .dev.vars

[[d1_databases]]
binding = "DB"
database_name = "japari-d1"
database_id = "<YOUR_D1_DATABASE_ID>"

[[kv_namespaces]]
binding = "KV"
id = "<YOUR_KV_NAMESPACE_ID>"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
